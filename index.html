<body style="overflow: hidden; background-color: #000000;">
  <!-- Preloader overlay (visible immediately, hidden after load) -->
  <div id="preloader-overlay" style="position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background-color: #000000; transition: opacity 0.5s ease-out;">
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@100;300;400;500;700&display=swap");

      #preloader-overlay * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .preloader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
        user-select: none;
      }

      /* Circular progress ring */
      .preloader-ring-wrap {
        position: relative;
        width: 140px;
        height: 140px;
      }

      @media (min-width: 768px) {
        .preloader-ring-wrap {
          width: 180px;
          height: 180px;
        }
      }

      .preloader-ring-svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }

      .preloader-ring-track {
        fill: none;
        stroke: rgba(255, 255, 255, 0.06);
        stroke-width: 3;
      }

      .preloader-ring-progress {
        fill: none;
        stroke: url(#preloader-gradient);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 408;
        stroke-dashoffset: 408;
        transition: stroke-dashoffset 0.1s ease-out;
      }

      @media (min-width: 768px) {
        .preloader-ring-track,
        .preloader-ring-progress {
          stroke-width: 2.5;
        }
        .preloader-ring-progress {
          stroke-dasharray: 527;
          stroke-dashoffset: 527;
        }
      }

      /* Percentage number inside the ring */
      .preloader-percent {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 2px;
      }

      .preloader-percent-number {
        font-family: "DM Sans", sans-serif;
        font-weight: 300;
        font-size: 40px;
        color: #ffffff;
        line-height: 1;
        letter-spacing: -2px;
      }

      @media (min-width: 768px) {
        .preloader-percent-number {
          font-size: 54px;
          letter-spacing: -3px;
        }
      }

      .preloader-percent-symbol {
        font-family: "DM Sans", sans-serif;
        font-weight: 300;
        font-size: 18px;
        color: rgba(255, 255, 255, 0.4);
        margin-left: 2px;
      }

      @media (min-width: 768px) {
        .preloader-percent-symbol {
          font-size: 22px;
        }
      }

      /* Brand name */
      .preloader-brand {
        font-family: "DM Sans", sans-serif;
        font-weight: 500;
        font-size: 13px;
        letter-spacing: 6px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.35);
      }

      @media (min-width: 768px) {
        .preloader-brand {
          font-size: 14px;
          letter-spacing: 8px;
        }
      }

      /* Horizontal progress bar */
      .preloader-bar-wrap {
        width: 200px;
        height: 2px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 2px;
        overflow: hidden;
      }

      @media (min-width: 768px) {
        .preloader-bar-wrap {
          width: 260px;
        }
      }

      .preloader-bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 2px;
        background: linear-gradient(90deg, #3B82F6, #60A5FA);
        transition: width 0.1s ease-out;
      }

      /* Glow behind the ring */
      .preloader-glow {
        position: absolute;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(59, 130, 246, 0.12) 0%, transparent 70%);
        pointer-events: none;
        animation: preloaderPulse 2s ease-in-out infinite;
      }

      @media (min-width: 768px) {
        .preloader-glow {
          width: 260px;
          height: 260px;
        }
      }

      @keyframes preloaderPulse {
        0%, 100% { opacity: 0.5; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1.05); }
      }
    </style>

    <div class="preloader-content">
      <div class="preloader-ring-wrap">
        <div class="preloader-glow"></div>
        <svg class="preloader-ring-svg" viewBox="0 0 140 140">
          <defs>
            <linearGradient id="preloader-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#3B82F6" />
              <stop offset="100%" stop-color="#93C5FD" />
            </linearGradient>
          </defs>
          <circle class="preloader-ring-track" cx="70" cy="70" r="65" />
          <circle id="preloader-ring" class="preloader-ring-progress" cx="70" cy="70" r="65" />
        </svg>
        <div class="preloader-percent">
          <span>
            <span id="preloader-number" class="preloader-percent-number">0</span>
            <span class="preloader-percent-symbol">%</span>
          </span>
        </div>
      </div>
      <div class="preloader-brand">Revate AI</div>
      <div class="preloader-bar-wrap">
        <div id="preloader-bar" class="preloader-bar-fill"></div>
      </div>
    </div>

    <script>
      (function () {
        var numberEl = document.getElementById("preloader-number");
        var ringEl = document.getElementById("preloader-ring");
        var barEl = document.getElementById("preloader-bar");
        var current = 0;
        var target = 0;
        var isMd = window.innerWidth >= 768;
        var circumference = isMd ? 527 : 408;

        // Simulate loading progress
        var stages = [
          { to: 30, delay: 0, duration: 600 },
          { to: 55, delay: 600, duration: 500 },
          { to: 75, delay: 1100, duration: 400 },
          { to: 90, delay: 1500, duration: 500 },
          { to: 100, delay: 2000, duration: 400 },
        ];

        stages.forEach(function (s) {
          setTimeout(function () { target = s.to; }, s.delay);
        });

        function updatePreloader() {
          if (current < target) {
            current += Math.max(1, Math.ceil((target - current) * 0.12));
            if (current > target) current = target;
          }

          numberEl.textContent = current;
          var offset = circumference - (current / 100) * circumference;
          ringEl.style.strokeDashoffset = offset;
          barEl.style.width = current + "%";

          if (current < 100) {
            requestAnimationFrame(updatePreloader);
          }
        }

        requestAnimationFrame(updatePreloader);
      })();
    </script>
  </div>
