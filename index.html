<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Charset & Viewport -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon -->
  <link rel="icon" type="image/webp" href="/revate-fav.png" />

  <!-- Title Tag -->
  <title>Revate | Web Development & AI Automation Agency</title>

  <!-- Meta Description -->
  <meta name="description"
    content="Revate is a premium web development and AI automation agency that builds intelligent, performance-driven websites and automation systems to grow your business." />

  <!-- Keywords (optional but not impactful today) -->
  <meta name="keywords"
    content="web development, AI automation, website design, intelligent systems, Revate, business automation, web agency" />

  <!-- Author (optional) -->
  <meta name="author" content="Revate" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Revate | Web Development & AI Automation Agency" />
  <meta property="og:description"
    content="Explore our intelligent, growth-focused web and AI solutions for modern businesses." />
  <meta property="og:image" content="https://revate.com/og-image.webp" />
  <meta property="og:url" content="https://revate.com" />
  <meta property="og:site_name" content="Revate" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Revate | Web Development & AI Automation Agency" />
  <meta name="twitter:description"
    content="Build smarter with Revate — where websites and AI meet to grow your business." />
  <meta name="twitter:image" content="https://revate.com/og-image.webp" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://revate.com" />

  <!-- Advanced SEO -->
  <meta name="theme-color" content="#000000" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

  <!-- Structured Data / JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebAgency",
    "name": "Revate",
    "url": "https://revate.com",
    "logo": "https://revate.com/revate-fav.png",
    "image": "https://revate.com/og-image.webp",
    "description": "Revate is a premium web development and AI automation agency that builds intelligent, performance-driven websites and automation systems.",
    "address": {
      "@type": "PostalAddress",
      "addressCountry": "US"
    }
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
